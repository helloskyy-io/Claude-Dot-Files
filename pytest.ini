[pytest]
# Pins pytest's rootdir to the repo root. This is not cosmetic: pytest collects
# conftest.py files from rootdir DOWN to each test directory, and with no ini
# file anywhere rootdir is inferred from the invocation instead.
#
# Measured, not assumed. With this file removed:
#   pytest scripts/.../tests/unit/test_x.py     (from the repo root)  -> conftest LOADS
#   cd scripts/.../tests/unit && pytest test_x.py                     -> conftest does NOT load
# The second form leaves RLIMIT_AS unbounded, silently dropping the memory
# guardrail that Testing Standard § Test Resource Safety makes binding — and a
# guardrail that depends on which directory the engineer happened to be standing
# in is not a guardrail. `test_memory_guardrail.py` asserts the live rlimit, so
# it goes red if this pin is ever removed.

# Scopes a BARE `pytest` invocation. testing/run-all.sh is unaffected — its suite
# runner passes discovered directories as explicit arguments, which override
# this. Add the path when a second component grows a tests/ directory, or a
# direct `pytest` will silently see less than run-all.sh does.
testpaths =
    scripts/workflows/temporal/tests
    testing/config-hooks/tests
    testing/scripts/tests
python_files = test_*.py
python_functions = test_*
