# =============================================================================
# Claude Dotfiles — Centralized Configuration
# =============================================================================
#
# This file is the source of truth for all service and workflow configuration.
# It is committed to the repo (no secrets allowed). Machine-specific overrides
# should use environment variables or local override files.
#
# Structure: each service or workflow gets its own top-level section.
# Use kebab-case keys. Document every field with a comment.
#
# Read values with: yq '.section.key' config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# gh-monitor — GitHub monitor for @claude PR comment automation
# -----------------------------------------------------------------------------
gh-monitor:
  # Folders containing git repos to monitor (scanned for subdirs with .git)
  # Folders that don't exist on this machine are silently skipped
  repo-folders: "~/Repos /opt/skyy-net"

  # Global safety cap on concurrent workflow script processes (revision.sh,
  # revision-major.sh, plan-revision.sh, build-phase.sh). Counts BOTH manual
  # terminal invocations AND gh-monitor dispatches. Does NOT count interactive
  # claude sessions. Same-PR concurrency is handled separately (per-PR check
  # serializes comments against the same PR to prevent branch-push races).
  # This cap exists to prevent runaway spawning during comment floods, not to
  # serialize normal multi-PR work. Raise if you commonly run many engineers.
  max-concurrent: 5

  # Route enablement (set to false to disable specific command routes)
  enable-revision: true
  enable-revision-major: true
  enable-plan-revision: true
  enable-build-phase: true
  enable-help: true

  # Dry run mode (detect comments and log, but don't run workflows)
  dry-run: false

  # Skip comments older than this many days
  backlog-days: 7

  # Path to workflow scripts (leave empty to auto-detect from repo root)
  # workflow-dir: ""

# -----------------------------------------------------------------------------
# models — per-workflow model map (single authority for every dispatch)
# -----------------------------------------------------------------------------
# Every workflow dispatch runs with an EXPLICIT --model resolved from this map
# at dispatch time (scripts/workflows/lib/run-claude.sh). This exists because
# headless runs otherwise inherit ambient defaults (e.g. the dispatching PM
# session's model) — model identity must be an explicit input, never derived.
#
# Values may be:
#   - aliases (sonnet, opus, fable, haiku) — float to the latest model of that
#     tier automatically. DEFAULT POSTURE: zero-maintenance capability upgrades.
#   - full model IDs (e.g. claude-opus-5) — pinned. Used selectively, on
#     evidence: (a) mid-sprint stability during a critical push, or (b) a
#     silent generation jump caused a measured regression (see cpi-decisions.md
#     watch-criteria). Upgrading a pin is a one-line commit.
#
# A/B override for a single dispatch (no config change):
#   MODEL_OVERRIDE=fable ./scripts/workflows/build-phase.sh <args>
#
# Changes take effect on the NEXT dispatch — no restarts required.
models:
  revision: sonnet              # light fixes — speed over depth
  revision-major: opus          # significant rework — the default engineer
  build-phase: opus             # phase implementation — the default engineer
  plan-new: fable               # 14-stage project planning — long-horizon synthesis
  plan-revision: fable          # planning revision — long-horizon synthesis
  sprint-review: opus           # holistic end-of-sprint judgment
  review-runs: sonnet           # CPI log analysis — mechanical + pattern work
  research: opus                # research pool creation — orchestration + synthesis authorship
  research-refresh: opus        # research revalidation — orchestration + synthesis diff
  pr-review: fable              # PR disposition engine — judgment-heavy /decide + /best-practices per item

  # Agent-tier canon (DOCUMENTATION ONLY — agents pin models in their own
  # frontmatter at config/agents/*.md, which cannot reference this file.
  # This block is the one-glance record; agent files MUST conform. Checked
  # at CPI time. Rationale per assignment in cpi-decisions.md 2026-07-26.)
  #   fable:  architect (deepest synthesis, +web verify),
  #           security-auditor (asymmetric-risk lens, +web CVE verify),
  #           research-analyst (long-horizon research sweeps, +web — the
  #           canonical Fable workload)
  #   opus:   planner, quality-control, standards-architect,
  #           research-currency (topic-retirement judgment, +web)
  #   sonnet: code-reviewer, refactoring-evaluator, standards-auditor,
  #           test-writer, doc-manager, workflow-analyst,
  #           research-critic (source verification diligence, +web —
  #           author≠critic model diversity vs fable analyst)
